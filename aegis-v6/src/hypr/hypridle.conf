# AegisOS v6 — hypridle config (idle lock after 600 s, same timing as v5)
# The lock goes through the Quickshell shell's IPC (its PAM lock screen);
# hyprlock is the fallback if the shell is not running.
general {
    lock_cmd = qs -c aegis ipc call aegis lock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
