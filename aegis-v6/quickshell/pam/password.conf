# AegisOS v6 — PAM service used by the Quickshell lock screen.
# Password-only stack, copied from the official Quickshell lockscreen
# example (quickshell-examples, lockscreen/pam/password.conf).
# Quickshell's PamContext is pointed at this file with
#   configDirectory: "pam"  +  config: "password.conf"
# so it loads <config-dir>/pam/password.conf, NOT /etc/pam.d/*.
# pam_unix verifies the typed password against the system account
# database for user "analyst".
auth required pam_unix.so
